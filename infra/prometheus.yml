global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # API metrics
  - job_name: 'job-queue-api'
    static_configs:
      - targets: ['api:3000']
    metrics_path: '/metrics'

  # Worker metrics
  - job_name: 'job-queue-worker'
    static_configs:
      - targets: ['worker:9100']
    metrics_path: '/metrics'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
